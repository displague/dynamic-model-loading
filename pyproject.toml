[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dynamic-model-loading"
version = "0.1.0"
description = "Measurements for quality-constrained FFN grouping and selective execution"
requires-python = ">=3.11"
dependencies = ["torch>=2.10,<3", "transformers>=5.13,<6", "safetensors>=0.8"]

[project.optional-dependencies]
dev = ["pytest>=9"]

[project.scripts]
dml = "dynamic_model_loading.experiment:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
